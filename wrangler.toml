# Cloudflare deployment for Broomstick.
#
# A static-assets-only Worker, like Test Card: no server code. The fleet does
# not use Cloudflare Pages.
#
# Deployed by hand from a checkout, not by a Cloudflare build:
#
#   npm ci && npm run build && cf-run npx wrangler@4.116.0 deploy
#
# `public/_headers` is copied into dist/ by Vite and carries the CSP; the
# assets runtime honours it. `npm run preview` does not apply it.

name = "broomstick"
compatibility_date = "2026-07-30"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"

# Attached here rather than by hand in the dashboard, so the hostname is part
# of the repo and a fresh deploy cannot come up without it.
#
# A ROUTE, not a custom domain. stoatworks-labs.com is at Cloudflare's limit of
# 100 Workers custom domains per zone, where `custom_domain = true` fails with
# API error 100122 while the upload itself succeeds -- so wrangler reports a
# Worker that nothing serves. A route has no such limit, but it needs a proxied
# DNS record to exist first, which wrangler does not create: `broomstick` has an
# AAAA 100:: record, proxied, made through the API on 2026-10-27 (the demos'
# recipe). Without it, or if it is ever deleted, the game is dark however green
# the deploy looks.
[[routes]]
pattern = "broomstick.stoatworks-labs.com/*"
zone_name = "stoatworks-labs.com"
