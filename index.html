<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#04050e" />
    <meta name="description" content="A witch on a broomstick, a forest at night, and trees that were there first. Tap to fly." />
    <title>Broomstick</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04050e;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
        cursor: pointer;
      }
      #mute {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        width: 44px;
        height: 44px;
        padding: 10px;
        border: 0;
        border-radius: 22px;
        background: rgba(4, 3, 10, 0.45);
        color: #f3ecd2;
        cursor: pointer;
        opacity: 0.7;
      }
      #mute:hover,
      #mute:focus-visible {
        opacity: 1;
      }
      #mute:focus-visible {
        outline: 2px solid #ffc23a;
        outline-offset: 2px;
      }
      #mute .off,
      #mute[aria-pressed='true'] .on {
        display: none;
      }
      #mute[aria-pressed='true'] .off {
        display: inline;
      }
      noscript {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f3ecd2;
        font: 20px Georgia, serif;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Broomstick: press Space, click or tap to fly the witch between the trees"></canvas>
    <button id="mute" type="button" aria-pressed="false" aria-label="Sound is on">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
        <g class="on"><path d="M16.5 8.5a5 5 0 0 1 0 7" /><path d="M19 6a8.5 8.5 0 0 1 0 12" /></g>
        <g class="off"><path d="M16 9l5 6" /><path d="M21 9l-5 6" /></g>
      </svg>
    </button>
    <noscript>Broomstick needs JavaScript. The witch insists.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
